name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select validated Xcode 26.1.1
        run: |
          # Match the locally validated release toolchain; 26.3 crashes during optimization.
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          swift --version
      - name: Tests
        run: swift test --disable-sandbox
      - name: Bundle and verify
        env:
          CODESIGN_IDENTITY: '-'
        run: ./Scripts/bundle.sh
      - name: Launch isolated native preview
        run: |
          build/Socius.app/Contents/MacOS/Socius --render-preview --tool Settings
          test -s build/tool-preview.png
