# Adapted from akalikbergenov/cyclop (MIT); see docs/releasing.md.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-existing-release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        name: Skip tags already published from a local notarized build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
              if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
                echo "published=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
  release:
    needs: check-existing-release
    if: needs.check-existing-release.outputs.published != 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select validated Xcode 26.1.1
        run: |
          # Match the locally validated release toolchain; 26.3 crashes during optimization.
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
      - name: Validate release metadata and credentials
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_ID: ${{ secrets.NOTARY_KEY_ID }}
        run: |
          source Scripts/release-version
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$NOTARY_KEY" && test -n "$NOTARY_ID"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$RELEASE_TAG"; fi
          test -s "docs/releases/${RELEASE_TAG#v}.md"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Tests
        run: swift test --disable-sandbox --no-parallel
      - name: Import signing identity into a temporary Keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          SIGNING_KEYCHAIN="$RUNNER_TEMP/socius-signing.keychain-db"
          SIGNING_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SIGNING_PASSWORD"
          security create-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$SIGNING_KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          test -n "$IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare notarization API key
        env:
          KEY_BASE64: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and verify DMG
        run: ./Scripts/release-dmg.sh
      - name: Smoke-test signed application
        run: build/release/Socius.app/Contents/MacOS/Socius --render-preview --tool Settings
      - name: Keep reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Socius-${{ env.RELEASE_VERSION }}-arm64
          path: |
            build/release/*.dmg
            build/release/SHA256SUMS
          if-no-files-found: error
      - name: Create draft prerelease for a version tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(mktemp)
          cat "docs/releases/$RELEASE_VERSION.md" > "$BODY"
          SUM=$(cut -d' ' -f1 build/release/SHA256SUMS)
          printf '\n\nSHA-256: `%s`\n' "$SUM" >> "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' >> "$BODY"
          gh release create "$RELEASE_TAG" "build/release/Socius-$RELEASE_VERSION-arm64.dmg" build/release/SHA256SUMS --verify-tag --draft --prerelease --title "Socius $RELEASE_VERSION" --notes-file "$BODY"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/socius-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
